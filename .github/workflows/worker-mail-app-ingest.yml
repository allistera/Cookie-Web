name: Worker mail-app-ingest

on:
  push:
    branches: [main]
    paths:
      - 'workers/mail-app-ingest/**'
      - '.github/workflows/worker-mail-app-ingest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workers/mail-app-ingest/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: workers/mail-app-ingest

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/mail-app-ingest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Validate wrangler config
        run: npx wrangler deploy --dry-run

  # Deploys only on manual dispatch — binding the Email Routing rule and
  # verifying the forward destination are dashboard steps (see RUNBOOK.md).
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/mail-app-ingest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker and set DATABASE_URL secret
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/mail-app-ingest
          secrets: |
            DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
