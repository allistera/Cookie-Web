<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/cookie-mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-167x167.png" sizes="167x167" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-152x152.png" sizes="152x152" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f9f8f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cookie" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Resource hints for the Worker origins the app calls at boot (see
      src/lib/apiWorkers.js). App.vue's authenticated watchers call the first
      four on every route; the default view, AI Today, loads the day from the
      tasks Worker, and it and the inbox read today's events from the calendar
      Worker. The messages Worker is first called when a message is opened, so
      it has no hint. The Auth0 tenant origin is added at runtime by
      src/main.js from VITE_AUTH0_DOMAIN.
    -->
    <link rel="preconnect" href="https://emails-api.infinitywave.online" crossorigin />
    <link rel="preconnect" href="https://labels-api.infinitywave.online" crossorigin />
    <link rel="preconnect" href="https://drafts-api.infinitywave.online" crossorigin />
    <link rel="preconnect" href="https://search-api.infinitywave.online" crossorigin />
    <link rel="preconnect" href="https://tasks-api.infinitywave.online" crossorigin />
    <link rel="preconnect" href="https://calendar-api.infinitywave.online" crossorigin />
    <!--
      The icon font is applied after auth (src/lib/iconFont.js), but its bytes
      can start arriving now so the first authenticated paint is not icon-less.
    -->
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Cookie AI Inbox - Workspace Intelligence</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
